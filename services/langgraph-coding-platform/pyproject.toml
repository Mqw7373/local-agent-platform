[project]
name = "langgraph-coding-platform"
version = "0.1.0"
description = "LangGraph orchestration for the shared local Coding Agent Loop runtime"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
langgraph-coding-platform = "langgraph_coding_platform.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["langgraph_coding_platform*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
